<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} | {% endif %}Anna Andrews, Web Design</title>
<meta name="description" content="{{ page.description | default: 'Anna Andrews designs and builds websites for small businesses, professional firms, and community organizations in the Chicago area.' }}">
<meta name="theme-color" content="#E6EAF6">

<script>document.documentElement.classList.add('js')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
<a class="skip" href="#top">Skip to content</a>

</main>
{% include footer.html %}
<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
